name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-config:
    name: Docs and config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build documentation in strict mode
        run: mkdocs build --strict

  docker-userspace:
    name: Docker userspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build CI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: wifi-direct-lab:ci
          build-args: |
            USER_UID=1000
            USER_GID=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate userspace image
        run: |
          docker run --rm wifi-direct-lab:ci bash -lc '
            set -euo pipefail

            test "$(id -u)" = "1000"
            test "$(id -un)" = "dev"

            wpa_supplicant-2.12 -v 2>&1 | grep -F "wpa_supplicant v2.12"
            wpa_cli-2.12 -v 2>&1 | grep -F "wpa_cli v2.12"

            test -d "${WPA_SUPPLICANT_SRC}/.git"
            test "$(git -C "${WPA_SUPPLICANT_SRC}" rev-parse HEAD)" = "${WPA_SUPPLICANT_COMMIT}"
            git -C "${WPA_SUPPLICANT_SRC}" log -1 --oneline

            test -f /opt/wifi-direct/src/wpa_supplicant-2.12/wpa_supplicant/compile_commands.json
            test -x /usr/bin/gdb
            test -x /usr/bin/gdbserver

            sudo -n /usr/bin/gdbserver --version >/dev/null

            if sudo -n /usr/bin/true 2>/dev/null; then
              echo "unexpected unrestricted passwordless sudo" >&2
              exit 1
            fi
          '

      - name: Explain runtime boundary
        run: |
          cat <<'TXT'
          CI validates the Docker userspace image only.
          mac80211_hwsim is a host-kernel module and is intentionally not loaded inside the GitHub-hosted runner container.
          Dual-radio P2P runtime validation remains a Linux-host integration test.
          TXT
